<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#banner-bg)"/>
  <rect width="1200" height="420" rx="16" fill="url(#ambient)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)"/>

  <!-- Grid Overlay -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Brand Label -->
  <text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="6" fill="#818CF8" text-anchor="middle">ONEFORGE PLATFORM</text>

  <!-- Master Title -->
  <text x="600" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#F8FAFC" text-anchor="middle">ONEFORGE SLEDGE</text>

  <!-- Subtitle -->
  <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="middle">AI-Powered Design Intelligence &amp; Design System Engineering Platform</text>

  <!-- Capability Pills -->
  <g transform="translate(200, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="85" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle">Site Extraction</text>
    
    <!-- Pill 2 -->
    <rect x="190" y="0" width="190" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="285" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#818CF8" text-anchor="middle">Design Intelligence</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="190" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="495" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#C084FC" text-anchor="middle">DESIGN.md Synthesis</text>

    <!-- Pill 4 -->
    <rect x="610" y="0" width="190" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="705" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle">MCP Agent Tools</text>
  </g>

  <!-- Bottom Command Snippet -->
  <g transform="translate(360, 335)">
    <rect x="0" y="0" width="480" height="42" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1"/>
    <text x="30" y="26" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="500" fill="#38BDF8">$</text>
    <text x="50" y="26" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="500" fill="#E2E8F0">sledge analyze https://example.com --generate</text>
  </g>
</svg>
