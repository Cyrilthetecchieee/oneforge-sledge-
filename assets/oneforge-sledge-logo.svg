<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="sledge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="239" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Geometric Grid Accent -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="280" y1="0" x2="280" y2="240"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Icon: OneForge Anvil & Sledge Symbol -->
  <g transform="translate(60, 48)">
    <!-- Ambient glow circle -->
    <circle cx="72" cy="72" r="54" fill="#6366F1" opacity="0.12" filter="url(#glow)"/>
    <!-- Hexagonal container -->
    <polygon points="72,18 126,49 126,111 72,142 18,111 18,49" fill="#0B132B" stroke="url(#brand)" stroke-width="3"/>
    <!-- Anvil / Core Forge Motif -->
    <path d="M 46 84 L 98 84 L 92 104 L 52 104 Z" fill="#38BDF8"/>
    <path d="M 40 68 L 104 68 C 104 68 108 72 100 78 L 44 78 C 36 72 40 68 40 68 Z" fill="#6366F1"/>
    <!-- Sledge Impact Beam -->
    <line x1="72" y1="36" x2="72" y2="64" stroke="url(#sledge)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="72" cy="36" r="6" fill="#FB923C"/>
  </g>

  <!-- Brand Typography -->
  <text x="240" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#94A3B8">ONEFORGE</text>
  <text x="240" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-1" fill="#F8FAFC">SLEDGE</text>

  <!-- Category Tagline -->
  <text x="242" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5" fill="#38BDF8">AI-POWERED DESIGN INTELLIGENCE &amp; TOKEN PLATFORM</text>
  
  <!-- Version Pill -->
  <rect x="680" y="40" width="70" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="715" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">v1.0.0</text>
</svg>
